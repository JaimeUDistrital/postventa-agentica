[project]
name = "modelo-financiero"
version = "0.1.0"
description = "Generador reproducible del modelo financiero (xlsx) y del resumen ejecutivo (PDF)"
requires-python = ">=3.14"
dependencies = [
    "openpyxl==3.1.5",
    "weasyprint==70.0",
]

[project.scripts]
modelo-financiero = "modelo_financiero:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "formulas==1.3.4",
    "pytest>=9.2.0",
]
